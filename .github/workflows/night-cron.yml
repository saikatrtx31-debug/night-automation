name: Tumblr Automated 3x Daily Schedule

on:
  schedule:
    # ১. আমেরিকা সকাল ৮:০০ AM EST (UTC 13:00)
    - cron: '0 13 * * *'
    # ২. আমেরিকা বিকাল ৪:০০ PM EST (UTC 21:00)
    - cron: '0 21 * * *'
    # ৩. আমেরিকা রাত ১২:০০ AM EST (UTC 5:00)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytumblr google-generativeai requests

     - name: Run Automation Script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py
